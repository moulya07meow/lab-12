<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ShopEasy - Products</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="navbar">
            <a href="index.html" class="logo">🛍️ ShopEasy</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html" class="active">Products</a></li>
                <li><a href="login.html">Login / Register</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="cart.html" class="cart-link">🛒 Cart <span id="cart-count" class="cart-badge">0</span></a></li>
            </ul>
        </div>
    </header>

    <main class="container">
        <h2 class="section-title">Our Products (Loaded from XML)</h2>
        <div id="product-list" class="product-grid"></div>
    </main>

    <script src="script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetchProductsFromXML(products => renderProductCards(products, "product-list"));
        });
    </script>
</body>
</html>
